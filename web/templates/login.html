<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #eee; display: grid; place-items: center; min-height: 100vh; }
    form { background: #181b22; padding: 28px; border-radius: 12px; width: min(360px, 92vw); border: 1px solid #2a2f3a; }
    input { width: 100%; padding: 10px; margin: 10px 0 16px; background: #10131a; color: #fff; border: 1px solid #2a2f3a; border-radius: 8px; }
    button { width: 100%; padding: 10px; background: #6d8bff; color: #fff; border: 0; border-radius: 8px; font-weight: 700; }
    .err { color: #ff6b6b; font-size: 0.9rem; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Dashboard</h1>
    <p>Enter the secret from <code>DASHBOARD_SECRET</code> in <code>.env</code>.</p>
    {{error}}
    <input type="password" name="secret" placeholder="Dashboard secret" autofocus>
    <button type="submit">Open</button>
  </form>
</body>
</html>
