<!doctype html>
<html lang="en" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yasunami</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>
    (function () {
      var allowed = ["sand", "ink", "ocean", "sakura", "matcha", "violet"];
      var current = "ink";
      try {
        var saved = localStorage.getItem("yasunami-theme");
        if (saved && allowed.indexOf(saved) !== -1) current = saved;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", current);
    })();
  </script>
</head>
<body>
  <div class="login-wrap">
    <form class="card" method="post" action="/login">
      <h1>Yasunami</h1>
      <p class="muted">Dashboard secret from <code>.env</code>.</p>
      {{error}}
      <input type="password" name="secret" placeholder="Secret" autofocus>
      <p><button type="submit">Enter</button></p>
    </form>
  </div>
</body>
</html>
